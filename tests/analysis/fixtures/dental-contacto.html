<!DOCTYPE html>
<html lang="es-ES">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contacto | Clínica Dental Ejemplo</title>
<script src="https://www.google.com/recaptcha/api.js"></script></head>
<body>
<h1>Contacto</h1>
<p>Rellena el formulario y te responderemos lo antes posible.</p>
<form action="/contacto/#wpcf7-f5" method="post" class="wpcf7-form">
  <input type="hidden" name="_wpcf7" value="5">
  <label for="f-nombre">Nombre</label><input id="f-nombre" type="text" name="your-name" required>
  <label for="f-apellidos">Apellidos</label><input id="f-apellidos" type="text" name="your-surname" required>
  <label for="f-email">Email</label><input id="f-email" type="email" name="your-email" required>
  <label for="f-tel">Teléfono</label><input id="f-tel" type="tel" name="your-phone">
  <label for="f-dni">DNI</label><input id="f-dni" type="text" name="dni">
  <label for="f-fecha">Fecha de nacimiento</label><input id="f-fecha" type="text" name="birth">
  <label for="f-mutua">Mutua</label><select id="f-mutua" name="mutua"><option>Ninguna</option></select>
  <label for="f-msg">Mensaje</label><textarea id="f-msg" name="your-message"></textarea>
  <label><input type="checkbox" name="acepto" required> He leído y acepto la política de privacidad</label>
  <input type="submit" value="Enviar">
</form>
<a href="/">Volver</a>
</body></html>
